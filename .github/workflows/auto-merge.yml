name: Approve and merge tested PR

on:
  pull_request_target:
    branches: [main]
    types: [ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # マージのキューの見回り。イベントが落ちても（待機中の実行が置き換えられても）次の見回りで進める。
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run ID to retry (empty = only advance the merge queue)
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: merge-main
  cancel-in-progress: false

jobs:
  merge:
    # CI の完了は成功でも失敗でも来る（キューの CI の失敗を PR に知らせ、次の PR へ進めるため）。push の CI は対象外。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # キューが承認した CI は完了しても workflow_run を起こさないので、見回りがその CI の完了を最大25分待ってマージする（#147）。
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            const { advanceQueue, autoMerge, readyRunId } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/auto-merge.mjs`)
            const runId = context.eventName === 'pull_request_target'
              ? await readyRunId({ github, ...context.repo, pr: context.payload.pull_request })
              : Number(process.env.CI_RUN_ID || 0)
            const results = []
            if (runId) results.push(await autoMerge({ github, ...context.repo, runId }))
            else results.push('no completed CI run for this event')
            // After every event, move the queue: merge a green up-to-date PR or bring main into the oldest green one.
            results.push(await advanceQueue({ github, ...context.repo }))
            for (const line of results) core.info(line)
            await core.summary.addRaw(results.join('\n\n')).write()
