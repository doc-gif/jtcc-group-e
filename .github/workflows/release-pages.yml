name: Release GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional new immutable version (e.g. v0.5.0). Empty = latest tag + patch. Publishes main as of this request.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:
  # 公開のキュー（docs/DEPLOYMENT.md）: concurrency で1本ずつ動き、前の公開の後のタグで版を決める。
  # 同じ SHA が公開済みなら何もしない（続けて来た依頼・置き換わった依頼を1回にまとめる）。古い SHA への巻き戻しは止める。
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plan the version and skip duplicate releases
        id: plan
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/release-plan.mjs
  verify:
    if: needs.validate.outputs.publish == 'true'
    permissions:
      contents: read
      actions: read
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check existing tag binding
        working-directory: source
        run: node scripts/check-release-tag.mjs
      - uses: actions/checkout@v4
        with:
          path: archive
          ref: main
          fetch-depth: 1
      - name: Load durable Pages archive
        working-directory: archive
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin pages-history >/dev/null
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            git fetch origin pages-history
            git checkout -B pages-history FETCH_HEAD
          elif [ "$result" -eq 2 ]; then
            git checkout --orphan pages-history
            git rm -rf .
          else
            exit "$result"
          fi
      - name: Preserve snapshot and update latest
        run: node source/scripts/compose-site.mjs archive/site dist
      - name: Save durable archive before publication
        working-directory: archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "Release $RELEASE_VERSION from $RELEASE_SHA"
            git push origin HEAD:pages-history
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: archive/site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Create tag and Release with downloadable build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cd dist
          zip -qr ../web-app.zip .
          cd ..
          node source/scripts/publish-release.mjs

  # 公開後の確認を自動で行う: Pages の反映を待ち、最新 URL の deployment.json・固定 URL・タグの SHA を照合して、URL と QR を出す。
  confirm:
    name: Confirm published release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      SITE_URL: ${{ needs.publish.outputs.site_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Read the commit of the release tag
        run: echo "TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" -q .sha)" >> "$GITHUB_ENV"
      - name: Wait for Pages and confirm version, SHA and fixed URL
        id: confirm
        run: node scripts/release-confirm.mjs
      - name: QR code of the fixed URL
        env:
          FIXED_URL: ${{ steps.confirm.outputs.fixed }}
        run: node scripts/create-qr.mjs "$FIXED_URL" release-qr.png
      - uses: actions/upload-artifact@v4
        with:
          name: release-qr
          path: release-qr.png
          retention-days: 30
          if-no-files-found: error
